name: Verify issue 3 and cleanup branches
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-issue-3-cleanup.yml]
permissions:
  contents: write
jobs:
  verify-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Verify point-in-time JGB valuation
        run: python -m pytest tests/test_point_in_time_valuation.py -q
      - name: Delete merged work branches
        run: |
          for branch in agent/fix-point-in-time-jgb ops/finalize-issue-3 ops/fix-issue-3-finalizer; do git push origin --delete "$branch" || true; done
      - name: Remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/verify-issue-3-cleanup.yml
          git commit -m 'chore: remove issue 3 verification workflow [skip ci]'
          git push origin HEAD:main
