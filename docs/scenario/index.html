<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NK225 valuation scenario</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.6;color:#171717}form{display:grid;gap:14px;margin:24px 0}label{display:grid;gap:6px}input,button{font:inherit;padding:10px}button{cursor:pointer}pre{background:#f4f4f4;padding:16px;white-space:pre-wrap}.note{color:#555;font-size:.92rem}
  </style>
</head>
<body>
  <p><a href="../">← Dashboard</a></p>
  <h1>Valuation scenario</h1>
  <p>現在金利シナリオをブラウザ内Pythonで再計算します。ここで入力した値は仮定値で、point-in-time正準系列を上書きしません。</p>
  <p id="manifest" class="note">Loading manifest…</p>
  <form id="scenario-form">
    <label>PER <input name="current_per" type="number" step="0.01" min="0.01" required></label>
    <label>10年JGB利回り (%) <input name="jgb_yield" type="number" step="0.01" required></label>
    <label>株式リスクプレミアム (%) <input name="risk_premium" type="number" step="0.01" required></label>
    <button type="submit">Pythonで再計算</button>
  </form>
  <pre id="scenario-output">入力して実行してください。</pre>
  <p id="runtime" class="note">Pyodideは初回実行時だけ読み込みます。</p>
  <p class="note">外部market APIへのアクセスは行いません。正準データの取得・更新はrepository pipeline側の責務です。</p>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
